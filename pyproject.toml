[project]
name = "shesh-orchestrator"
version = "0.1.0"
description = "Shesh Mind: multi-agent RLM runtime (coordinator/planner/coder/researcher/vision/critic) over A2A"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gagan Jain" }]
dependencies = ["fastmcp>=3.4.7,<4", "shesh-audit>=0.1", "shesh-mind>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
shesh-orchestrator-mcp = "shesh_orchestrator.server:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I"]
ignore = ["E402"]

[tool.pytest.ini_options]

pythonpath = ["src"]
testpaths = ["tests"]
