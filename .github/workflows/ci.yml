name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all

jobs:
  component:
    uses: gaganjainse/shesh-ecosystem/.github/workflows/component-ci.yml@main  # first-party reusable pipeline (D1); @main so rewrites never orphan the pin
    # Decision D1: pipeline definition lives in shesh-ecosystem; only
    # this repo's deltas below — do NOT vendor steps back into this file.
    with:
      existing-repos: "shesh-audit"
